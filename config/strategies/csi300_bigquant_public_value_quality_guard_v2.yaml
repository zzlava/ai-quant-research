# Development-only public reconstruction. This is a value-first revision after
# the original quality/improvement/value blend failed the factor-direction gate.
name: quality_value_v1
config_id: csi300_bigquant_public_value_quality_guard_v2
version: "2.0.0"
research_scope: public_reconstruction

regime:
  market_weight: 0.70
  global_weight: 0.30

fundamental:
  required: true
  max_report_age_days: 550
  max_valuation_age_days: 10
  min_quality_components: 3
  min_improvement_components: 1
  min_value_components: 2

fundamental_ranking:
  quality_weight: 0.0
  improvement_weight: 0.0
  value_weight: 1.0
  crowding_penalty: 0.03
  execution_penalty: 0.10
  attention_penalty: 0.08
  min_quality_score: 20.0
  min_improvement_score: 20.0
  min_score: 50.0

universe:
  mode: public_reconstruction
  id: csi300_bigquant_public_reconstruction
  expected_constituents: 300
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 120
  min_avg_turnover_20d: 100000000

market_gate:
  - { min: 0.0, max: 40.0, max_new_positions: 0 }
  - { min: 40.0, max: 55.0, max_new_positions: 1 }
  - { min: 55.0, max: 70.0, max_new_positions: 2 }
  - { min: 70.0, max: 100.1, max_new_positions: 3 }

trade:
  exit_policy: fixed_horizon
  take_profit: 0.20
  stop_loss: -0.20
  min_holding_days: 20
  max_holding_days: 20
  cooldown_days: 0
  signal_interval_days: 20
  signal_anchor_date: 2022-01-04
  require_target_lot_affordability: true
  limit_pct: 0.10
  st_limit_pct: 0.05
  model_limit_moves: true

portfolio:
  initial_cash: 80000
  max_positions: 3
  weighting: equal_weight

costs:
  commission_rate: 0.00025
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  stamp_tax_schedule:
    - effective_from: 1900-01-01
      rate: 0.001
    - effective_from: 2023-08-28
      rate: 0.0005
  slippage_bps: 5.0

data:
  market_index: 000300.SH
  global_symbol: SPX
  adjustment: backward
  require_point_in_time_adjustment: true
  decision_timezone: Asia/Shanghai
  decision_time: "15:00"
  min_history_bars: 21
  sessions:
    000300.SH:
      market: CN
      timezone: Asia/Shanghai
      session_close: "15:00"
    SPX:
      market: US
      timezone: America/New_York
      session_close: "16:00"
