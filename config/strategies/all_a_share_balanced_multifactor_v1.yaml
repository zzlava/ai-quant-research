# Development-only successor hypothesis. It does not modify or reuse the
# consumed p10_h20 OOS protocol. A new prospective/OOS window must be frozen
# before this strategy can be evaluated for performance.
name: balanced_multifactor_v1
config_id: all_a_share_balanced_multifactor_v1
version: "1.1.0"
research_scope: historical_all_a_share

regime:
  market_weight: 0.70
  global_weight: 0.30

fundamental:
  required: true
  revision_policy: strict_initial_as_announced
  max_report_age_days: 550
  max_valuation_age_days: 10
  min_quality_components: 3
  min_improvement_components: 1
  min_value_components: 2

ownership:
  # Sparse source coverage makes this evidence-conditional. Unknown rows stay
  # unknown and remove this component from that stock's weight denominator.
  required: false
  proxy: top10_float_non_individual_ratio
  max_report_age_days: 200
  min_complete_holders: 10
  min_cross_section_coverage: 0.80
  personal_holder_types: ["个人", "自然人"]

balanced_ranking:
  quality_weight: 0.25
  improvement_weight: 0.15
  value_weight: 0.10
  momentum_weight: 0.20
  # Higher current circulating market value receives the higher percentile.
  # This is a continuous penalty on small caps, not a hindsight size cutoff.
  size_weight: 0.15
  # Proxy: non-personal share of a complete top-ten-float-holder disclosure.
  institutional_weight: 0.15
  crowding_penalty: 0.02
  execution_penalty: 0.05
  attention_penalty: 0.03
  min_quality_score: 30.0
  min_improvement_score: 30.0
  min_score: 50.0

universe:
  mode: derived_liquid
  id: all_a_share_derived_liquid_cn
  exclude_st: true
  exclude_suspended: true
  min_listing_days: 250
  min_avg_turnover_20d: 100000000

market_gate:
  - { min: 0.0, max: 40.0, max_new_positions: 0 }
  - { min: 40.0, max: 55.0, max_new_positions: 3 }
  - { min: 55.0, max: 70.0, max_new_positions: 7 }
  - { min: 70.0, max: 100.1, max_new_positions: 10 }

trade:
  exit_policy: fixed_horizon
  take_profit: 0.20
  stop_loss: -0.20
  min_holding_days: 20
  max_holding_days: 20
  cooldown_days: 0
  signal_interval_days: 20
  signal_anchor_date: 2022-01-04
  blocked_entry_policy: defer
  max_entry_delay_days: 3
  require_target_lot_affordability: true
  limit_pct: 0.10
  st_limit_pct: 0.05
  model_limit_moves: true

portfolio:
  initial_cash: 80000
  max_positions: 10
  weighting: equal_weight
  # PIT price correlation is used as a diversification constraint because the
  # available static industry labels are not valid historical classifications.
  max_pairwise_correlation: 0.75
  correlation_lookback_days: 120

costs:
  commission_rate: 0.00025
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  stamp_tax_schedule:
    - effective_from: 1900-01-01
      rate: 0.001
    - effective_from: 2023-08-28
      rate: 0.0005
  slippage_bps: 5.0

data:
  market_index: 000300.SH
  global_symbol: SPX
  adjustment: backward
  require_point_in_time_adjustment: true
  decision_timezone: Asia/Shanghai
  decision_time: "17:30"
  min_history_bars: 121
  sessions:
    000300.SH:
      market: CN
      timezone: Asia/Shanghai
      session_close: "15:00"
    SPX:
      market: US
      timezone: America/New_York
      session_close: "16:00"
