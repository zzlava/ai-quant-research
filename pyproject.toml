[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-research"
version = "0.1.0"
description = "A-share research scoring, ranking, and historical backtest MVP"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ai-quant-research" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "polars>=1.12.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
tushare = [
    "tushare>=1.4.0",
]
bigquant = [
    "bigquantdai>=1.0.9",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "pandas>=2.2.0",
]

[project.scripts]
ai-quant = "app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "local_data: requires git-ignored, hash-bound local research artifacts",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
